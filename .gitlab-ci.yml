stages:
  - build
  - test
  - deploy

variables:
  GAME_VERSION: "EMERALD"
  GAME_REVISION: "0"
  GAME_LANGUAGE: "ENGLISH"
  COMPARE: "0"
  UNUSED_ERROR: "1"
  GIT_SUBMODULE_STRATEGY: recursive
  NPROC: "16"

build_rom:
  stage: build
  image: ubuntu:latest
  before_script:
    - apt update && apt install -y binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 golang-go make git
  script:
    - make -j$(nproc) -O all
  artifacts:
    paths:
      - silicon.gba
    expire_in: 5 minutes

test_rom:
  stage: test
  image: ubuntu:latest
  needs:
    - job: build_rom
      artifacts: true
  before_script:
    - apt update && apt install -y binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 golang-go make git cmake libelf-dev
  script:
    - make -j$(nproc) > /dev/null
    - make -j$(nproc) check
    - touch test/battle/silicon_exp.c
    - make -j$(nproc) checktrainers TESTS="Silicon Exp Test"
    - make -j$(nproc) checktrainers TESTS="All Resido"
  artifacts:
    paths:
      - silicon.gba
    expire_in: 5 minutes

upload_to_r2:
  stage: deploy
  image: ubuntu:latest
  needs:
    - job: test_rom
      artifacts: true
  before_script:
    - apt update && apt install -y git gettext curl jq awscli
  script:
    - |
      COMMIT_HASH=$(git rev-parse --verify HEAD)
      COMMIT_MESSAGE=$(git log -1 --pretty=%B | jq -Rs . | sed 's/^"\(.*\)"$/\1/')
      MAX_LENGTH=3900
      if [ ${#COMMIT_MESSAGE} -gt $MAX_LENGTH ]; then
        COMMIT_MESSAGE="${COMMIT_MESSAGE:0:$MAX_LENGTH}"
        COMMIT_MESSAGE="${COMMIT_MESSAGE}\n👀 Read more: https://gitlab.com/gorgonzolafoundation/silicon/-/commit/$COMMIT_HASH"
      fi

      export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
      export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
      export AWS_DEFAULT_REGION="auto"
      R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      OBJECT_KEY="builds/${CI_COMMIT_SHORT_SHA}/silicon_${TIMESTAMP}.gba"

      aws s3 cp silicon.gba "s3://${R2_BUCKET_NAME}/${OBJECT_KEY}" \
        --endpoint-url "$R2_ENDPOINT" \
        --no-progress

      R2_URL="https://${R2_PUBLIC_DOMAIN}/${OBJECT_KEY}"
      echo "Artifact uploaded to: $R2_URL"
      export R2_URL COMMIT_MESSAGE

      if [ "$CI_PIPELINE_SOURCE" == "push" ]; then
        TEMPLATE_FILE="discord_embed_template.json"
      else
        TEMPLATE_FILE="weekly_discord_embed_template.json"
      fi
      envsubst < $TEMPLATE_FILE > expanded.json
      curl -d @expanded.json -H "Content-Type: application/json" "$DISCORD_WEBHOOK_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
